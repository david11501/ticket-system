<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Bine ai venit, {{user.username}}!</h1>
    <p>Rol: {{user.rol}}</p>

    <h2>Tichete</h2>
    <ul>
        {% for tichet in tichete %}
        <li>
            {{tichet.titlu}} - {{tichet.status}}
            {% if tichet.adnotari %}
                <br>Adnotare: {{tichet.adnotari}}
            {% endif %}

            {% if user.rol=="inginer"%}
            <form method="post" action="/tickets/{{ tichet.id}}/update-form">
                <select name="status">
                    <option value="nou"{% if tichet.status=="nou" %}selected{% endif %}>Nou</option>
                    <option value="in lucru" {% if tichet.status=="in lucru" %}selected{% endif %}>In lucru</option>
                    <option value="rezolvat" {% if tichet.status=="rezolvat"%}selected{% endif %}>Rezolvat</option>
                </select>
                <input type="text" name="adnotari" placeholder="Adauga adnotare" value="{{ tichet.adnotari or ''}}">
                <button type="submit">Actualizeaza</button>
            </form>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
